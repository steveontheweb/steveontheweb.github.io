<header class="site-header" aria-label="Primary navigation">
  <div class="site-header__inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Steve on the Web, by Steve Middleton, P.Eng., home">
      <img
        class="wordmark__mark"
        src="{{ '/assets/img/brand/steve-on-the-web-mark.png' | relative_url }}"
        width="48"
        height="48"
        alt=""
        aria-hidden="true"
      >
      <span class="wordmark__text">
        <span class="wordmark__name" id="topbar-title">Steve on the Web</span>
        <span class="wordmark__byline">Steve Middleton, P.Eng.</span>
      </span>
    </a>

    <nav class="site-nav site-nav--desktop" aria-label="Main menu">
      <a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' %} aria-current="page"{% endif %}>Blog</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
    </nav>

    <details class="site-menu">
      <summary>Menu</summary>
      <nav class="site-nav" aria-label="Main menu">
        <a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' %} aria-current="page"{% endif %}>Blog</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
      </nav>
    </details>

    <div class="site-tools">
      <button type="button" id="search-trigger" class="site-tool" aria-label="Search">
        <i class="fas fa-search fa-fw" aria-hidden="true"></i>
      </button>

      <search id="search" class="align-items-center">
        <i class="fas fa-search fa-fw" aria-hidden="true"></i>
        <input
          class="form-control"
          id="search-input"
          type="search"
          aria-label="Search articles"
          autocomplete="off"
          placeholder="Search the notebook"
        >
      </search>
      <button type="button" class="site-tool" id="search-cancel">Close</button>
    </div>
  </div>
</header>

<aside id="sidebar" aria-hidden="true"></aside>
<button id="sidebar-trigger" type="button" hidden aria-hidden="true"></button>
